name: Move the Pro files of the price history to R2
# Started by hand, once (26 Nov 2026), while the Pro files of the price history
# are still in the repository: sends them to the private R2 bucket and checks,
# by downloading them all apart, that R2 has them byte for byte. Taken out with
# the files, once they are in R2.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Send them to R2 and check they are there as they are here
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws --version
          ./r2_price_history.sh up
          ./r2_price_history.sh verify-content
