name: Price history (daily)
# The history of the day-ahead prices for the Pro plan, data/price-history/
# (see fetch_price_history.py): once a day, the days of the last 10 up to
# tomorrow that are still missing, from SMARD (and Energy-Charts for the days
# SMARD lacks, one request a zone, 31 seconds apart) and OMIE; and the PPA
# index of OMIP (data/ppa-index.json), a new point each quarter. At 15:10 UTC tomorrow's prices are
# out at both. The first fill is fill-price-history.yml, started by hand.
#
# The Pro files (each zone's years and the daily means) are kept in the private
# R2 bucket eupowerdata-pro, not in this public repository (since 26 Nov 2026):
# the run gets them from R2, brings them up to date, sends back the ones that
# changed (a failure ends the run in error, before anything is committed) and
# commits only the public ones, the index and the monthly means. See
# r2_price_history.sh.
on:
  schedule:
    - cron: '10 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
# The fill writes the same files: one at a time.
concurrency:
  group: price-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      # The branch as it is when the job starts, not the commit the run was
      # asked for: a run that waited for the fill would otherwise work on
      # files that are no longer the published ones, and could not push.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: '3.12'
      - name: Get the Pro files of the price history from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: ./r2_price_history.sh down
      - name: Bring the price history up to date
        env:
          PRICE_HISTORY_BUDGET_SECONDS: '600'
        run: python fetch_price_history.py
      - name: Send the Pro files that changed to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: ./r2_price_history.sh up
      # The PPA index of the Insights (see fetch_ppa_index.py): a request to OMIP
      # only when the quarter has no point yet. Never fails the run.
      - name: PPA price index (OMIP)
        continue-on-error: true
        timeout-minutes: 3
        run: python fetch_ppa_index.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the public files: the Pro ones are in .gitignore and in R2.
          git add data/price-history/index.json data/price-history/monthly.json data/ppa-index.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update the price history and the PPA index $(date -u '+%Y-%m-%d %H:%M UTC')"
          # The 15-minute fetch pushes to main too: rebase on top of it, then push.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed - retrying"
            sleep 5
          done
          echo "::error::Could not push the price history after 3 attempts"
          exit 1
