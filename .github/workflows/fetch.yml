name: Fetch ENTSO-E Data
on:
  # The clock is the Cloudflare Worker in scheduler/: every 15 minutes, at
  # minutes 7, 22, 37 and 52, it starts a run through workflow_dispatch.
  workflow_dispatch:
    inputs:
      # For a run asked for by hand: gh workflow run fetch.yml -f force=true
      # The Worker never sends it.
      force:
        description: Run even if the published data are under 7 minutes old
        type: boolean
        default: false
  # GitHub's own schedule drops most of its runs (one started of the 37 due on
  # the night of 15 to 16 Nov 2026). It stays as a fallback, for when the
  # Worker cannot start a run: same minutes, off the start of the hour and the
  # round quarters, which is when GitHub delays and drops the most.
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
# One run at a time. A run that starts while another is going waits for it to
# finish instead of running beside it: two runs at once write the same files
# and the second cannot push (run 2365). At most one run waits; a newer one
# takes its place in the queue.
concurrency:
  group: fetch-entsoe-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    # Each step has its own limit; this one is only a backstop and must stay
    # above their sum, so that it is never the job that gets cancelled.
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'   # progress shows in the log while the script runs
    steps:
      # The branch as it is when the job starts, not the commit the run was
      # asked for. A run that waited in the queue was asked for before the run
      # ahead of it pushed its data: left on that older commit, it works on
      # files that are no longer the published ones and cannot push (run 2371).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # GitHub sometimes holds a run for 15 to 25 minutes and then lets it go
      # right behind another. With published data under 7 minutes old there is
      # nothing new to bring: every step below is skipped, no source is asked
      # for anything, nothing is committed and the run ends in success (see
      # skip_if_fresh.py). If this step cannot tell, the run goes ahead.
      - name: Is there anything new to fetch?
        id: fresh
        continue-on-error: true
        timeout-minutes: 1
        env:
          FORCE: ${{ inputs.force }}
        run: python skip_if_fresh.py
      # The script stops by itself after FETCH_BUDGET_SECONDS (300 s) and writes
      # each file as soon as its dataset is done, so the step limit is slack.
      - name: Fetch ENTSO-E data
        id: entsoe
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        timeout-minutes: 7
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python fetch_entsoe.py
      # The steps below run even when an earlier one failed or ran out of time.
      - name: Fetch GB (Elexon Insights) data
        id: gb
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        timeout-minutes: 2
        run: python fetch_gb.py
      # The two below read data/generation-mix.json, so they come after it.
      - name: Spain generation (copy of the ENTSO-E ES zone)
        id: ree
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        run: python fetch_ree.py
      - name: Portugal generation (REN, else the ENTSO-E PT zone)
        id: ren
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        run: python fetch_ren.py
      - name: OMIE day-ahead prices
        id: omie
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python fetch_omie.py
      # Runs every time but only does something when the file is over 12 hours old.
      # No request: it reads data/capacity-installed.json and data/ember-yearly.json.
      - name: Installed capacity (ENTSO-E + Ember)
        id: capacity
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        run: python merge_capacity.py
      # MET Norway's terms must be read and accepted by a person before its API
      # is used: until the repository variable MET_NORWAY_TOS_ACCEPTED is "true"
      # this step makes no request. https://api.met.no/doc/TermsOfService
      - name: Weather (MET Norway)
        id: weather
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          MET_NORWAY_TOS_ACCEPTED: ${{ vars.MET_NORWAY_TOS_ACCEPTED }}
        run: python fetch_weather.py
      - name: Commit and push
        id: commit
        if: ${{ always() && steps.fresh.outputs.skip != 'true' }}
        timeout-minutes: 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A step that was killed mid-write may have left a broken file behind:
          # put the committed version back rather than publish it to the site.
          for f in $(git ls-files --modified --others --exclude-standard -- 'data/*.json'); do
            [ -f "$f" ] || continue   # deleted on purpose (archive older than 5 years)
            if ! python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$f" 2>/dev/null; then
              echo "::warning::$f is not valid JSON - keeping the committed version"
              git checkout -q -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update ENTSO-E data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Other workflows push to main too: rebase on top of them, then push.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed - retrying"
            sleep 5
          done
          echo "::error::Could not push after 3 attempts"
          exit 1
      # --- The newer datasets -------------------------------------------------
      # They come after the commit above on purpose: the files the site already
      # reads are published first, and nothing below can hold them back or
      # undo them. Each step has its own time budget (inside the script, well
      # under the step's limit) and never fails the run; what it could not get
      # keeps what was published before (see feed_common.py). Their files are
      # published by a second commit, at the end.
      - name: Balancing prices (ENTSO-E 17.1.F and PICASSO)
        id: balancing
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python fetch_balancing.py
      - name: Outages of power plants and lines (ENTSO-E 15.1 and 10.1)
        id: outages
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python fetch_outages.py
      # Reads data/wind-solar-actual.json, which the ENTSO-E step above keeps.
      - name: Forecast error of wind and solar (ENTSO-E 14.1.D)
        id: forecast
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python fetch_forecast.py
      # Reads data/spot-prices-intervals.json, which the ENTSO-E step above keeps, and OMIE's files.
      - name: Negative, zero and low prices (OMIE and ENTSO-E)
        id: low_prices
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        run: python fetch_low_prices.py
      # Prices of open sources only, for the paid alerts: SMARD (cc-by-4.0) for 15
      # zones, Elexon for GB and OMIE (data/omie-prices.json, written above) for
      # PT and ES. No request to ENTSO-E. Tomorrow's prices are asked for again in
      # every run from 12:30 Brussels time until they are out. The days SMARD
      # lacks are asked of Energy-Charts (2 zones a run at most, its limit) and
      # taken only under CC BY 4.0.
      - name: Open-source day-ahead prices (SMARD, Elexon, OMIE)
        id: open_prices
        if: ${{ !cancelled() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          OPEN_PRICES_BUDGET_SECONDS: '60'
        run: python fetch_open_prices.py
      # The state of the files the site reads, for its status page: whether
      # each is there, when its data are of, its size and counts, and how each
      # step of this run ended (see build_meta.py). No request; never fails.
      - name: State of the files (data/meta.json)
        id: meta
        if: ${{ always() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          STEP_ENTSOE: ${{ steps.entsoe.outcome }}
          STEP_GB: ${{ steps.gb.outcome }}
          STEP_REE: ${{ steps.ree.outcome }}
          STEP_REN: ${{ steps.ren.outcome }}
          STEP_OMIE: ${{ steps.omie.outcome }}
          STEP_CAPACITY: ${{ steps.capacity.outcome }}
          STEP_WEATHER: ${{ steps.weather.outcome }}
          STEP_COMMIT: ${{ steps.commit.outcome }}
          STEP_BALANCING: ${{ steps.balancing.outcome }}
          STEP_OUTAGES: ${{ steps.outages.outcome }}
          STEP_FORECAST: ${{ steps.forecast.outcome }}
          STEP_LOW_PRICES: ${{ steps.low_prices.outcome }}
          STEP_OPEN_PRICES: ${{ steps.open_prices.outcome }}
        run: python build_meta.py
      - name: Commit and push the newer datasets
        if: ${{ always() && steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # As in the commit above: a step killed mid-write must not publish a broken file.
          for f in $(git ls-files --modified --others --exclude-standard -- 'data/*.json'); do
            [ -f "$f" ] || continue
            if ! python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$f" 2>/dev/null; then
              echo "::warning::$f is not valid JSON - keeping the committed version"
              git checkout -q -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update balancing, outage, forecast, low-price and open-price data $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed - retrying"
            sleep 5
          done
          echo "::error::Could not push the newer datasets after 3 attempts"
          exit 1
