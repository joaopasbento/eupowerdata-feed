name: fetch-datacenters

on:
  schedule:
    # Daily at 04:00 UTC (datacenter list changes slowly)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-datacenters:
    runs-on: ubuntu-latest
    # When Overpass does not answer, fetch_datacenters.py tries again after 5,
    # 10 and 15 minutes; it fails the run only when the file kept is more than
    # 7 days old (a warning otherwise).
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # reverse_geocoder bundles a ~85MB offline dataset of >3M cities
        # used to resolve datacenter coordinates → ISO country codes.
        # Worldwide coverage, no API rate limits, sub-millisecond lookups.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch datacenters
        env:
          PYTHONUNBUFFERED: '1'
        run: python fetch_datacenters.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update datacenter data $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Rebase after the commit (a rebase refuses to run with uncommitted
            # changes) and before the push, so that a commit made to main while
            # this workflow was running does not get the push rejected.
            git pull --rebase origin main
            git push
          fi
