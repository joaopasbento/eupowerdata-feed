name: Diagnose ENTSO-E answers (temporary)
# TEMPORARY, 17 Nov 2026: started by hand only, while the reading of the
# prices is being put right. It writes to the log the structure of ENTSO-E's
# answers (see diagnose_entsoe.py), never the API key nor an address with it,
# writes no file and commits nothing. To be removed when that work is done.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: structure of the answers, or the feed's own reading of the prices
        type: choice
        options: [structure, prices]
        default: structure
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ask ENTSO-E and print the structure of its answers
        timeout-minutes: 10
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          DIAGNOSE: ${{ inputs.mode }}
        run: python diagnose_entsoe.py
